<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crispy - HTML/CSS/JS Animator & Renderer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="/" class="site-logo">
            <!-- Optional: Inline SVG for crisp scaling -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <span>CRISPY</span>
        </a>

        <div class="ai-controls">
            <input type="password" id="api-key" placeholder="OpenAI API Key (Optional for manual editing)">
            <input type="text" id="ai-prompt" placeholder="E.g., Make a bouncing ball animation">
            <button id="ai-generate-btn">Tweak/Generate with AI</button>
        </div>
    </header>

    <main>
        <section class="editor-section">
            <div class="editor-panel">
                <h3>HTML</h3>
                <textarea id="html-code" spellcheck="false">&lt;div class="box"&gt;&lt;/div&gt;</textarea>
            </div>
            <div class="editor-panel">
                <h3>CSS</h3>
                <textarea id="css-code" spellcheck="false">
.box {
  width: 100px;
  height: 100px;
  background-color: red;
  position: absolute;
  top: 50px;
  left: 50px;
  animation: moveRight 2s infinite alternate;
}

@keyframes moveRight {
  from { left: 50px; }
  to { left: 300px; background-color: blue;}
}
                </textarea>
            </div>
            <div class="editor-panel">
                <h3>JS</h3>
                <textarea id="js-code" spellcheck="false">// JS goes here</textarea>
            </div>
        </section>

        <section class="preview-section">
            <h3>Live Preview</h3>
            <div class="preview-container">
                <iframe id="preview-frame"></iframe>
            </div>
        </section>

        <aside class="options-section">
            <h3>Render Options</h3>
            <div class="option-group">
                <label>Width:</label>
                <input type="number" id="opt-width" value="800">
            </div>
            <div class="option-group">
                <label>Height:</label>
                <input type="number" id="opt-height" value="600">
            </div>
            <div class="option-group">
                <label>Duration (s):</label>
                <input type="number" id="opt-duration" value="4" step="0.1">
            </div>
            <div class="option-group">
                <label>FPS:</label>
                <input type="number" id="opt-fps" value="30">
            </div>
            <div class="option-group">
                <label>Format:</label>
                <select id="opt-format">
                    <option value="gif">GIF</option>
                    <option value="webp">WebP</option>
                    <option value="webm">WebM (Transparent Video)</option>
                    <option value="mp4">MP4</option>
                </select>
            </div>
            <div class="option-group checkbox-group">
                <input type="checkbox" id="opt-loop" checked>
                <label for="opt-loop">Loop</label>
            </div>
            <div class="option-group checkbox-group">
                <input type="checkbox" id="opt-transparent">
                <label for="opt-transparent">Transparent Background</label>
            </div>

            <button id="render-btn" class="primary-btn">Render Animation</button>

            <div id="render-status" class="status-msg"></div>

            <div id="result-container" style="display: none;">
                <h3>Result:</h3>
                <a id="download-link" href="#" target="_blank" download>Download File</a>
                <div id="media-preview"></div>
            </div>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
